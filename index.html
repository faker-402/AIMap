<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>时间戳转换工具 - 在线 Unix 时间戳与日期互转</title>
<meta name="description" content="免费在线时间戳转换工具，支持 Unix 时间戳与北京时间互转，秒/毫秒自动识别，实时显示当前时间戳。">
<meta name="keywords" content="时间戳转换,unix时间戳,时间戳转日期,日期转时间戳,timestamp">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f0f2f5;
    min-height: 100vh;
    padding: 20px;
    color: #333;
  }
  .container { max-width: 720px; margin: 0 auto; }
  h1 {
    text-align: center;
    font-size: 24px;
    margin: 20px 0 8px;
  }
  .subtitle {
    text-align: center;
    color: #888;
    font-size: 14px;
    margin-bottom: 24px;
  }
  .card {
    background: #fff;
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  .card h2 {
    font-size: 16px;
    margin-bottom: 16px;
    color: #555;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card h2::before {
    content: "";
    width: 4px; height: 16px;
    background: #4a7dff;
    border-radius: 2px;
  }
  .now-display {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
  }
  .now-item {
    flex: 1;
    min-width: 200px;
    background: #f7f9fc;
    border-radius: 8px;
    padding: 12px 16px;
  }
  .now-item .label { font-size: 12px; color: #999; margin-bottom: 4px; }
  .now-item .value {
    font-size: 20px;
    font-weight: 600;
    font-family: "SF Mono", Consolas, monospace;
    color: #4a7dff;
    cursor: pointer;
  }
  .now-item .value:hover { text-decoration: underline; }
  .row {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }
  input[type="text"], input[type="datetime-local"], select {
    flex: 1;
    min-width: 180px;
    padding: 10px 14px;
    border: 1px solid #d9d9d9;
    border-radius: 8px;
    font-size: 15px;
    font-family: "SF Mono", Consolas, monospace;
    outline: none;
    transition: border-color .2s;
  }
  input:focus, select:focus { border-color: #4a7dff; }
  button {
    padding: 10px 24px;
    background: #4a7dff;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    cursor: pointer;
    transition: background .2s;
    white-space: nowrap;
  }
  button:hover { background: #3566e0; }
  .result {
    margin-top: 16px;
    background: #f7f9fc;
    border-radius: 8px;
    padding: 12px 16px;
    display: none;
  }
  .result.show { display: block; }
  .result-line {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 0;
    font-size: 14px;
    flex-wrap: wrap;
    gap: 4px;
  }
  .result-line .k { color: #999; }
  .result-line .v {
    font-family: "SF Mono", Consolas, monospace;
    cursor: pointer;
    word-break: break-all;
  }
  .result-line .v:hover { color: #4a7dff; }
  .tip {
    font-size: 12px;
    color: #aaa;
    margin-top: 12px;
  }
  footer {
    text-align: center;
    color: #bbb;
    font-size: 12px;
    padding: 20px 0;
  }
  .toast {
    position: fixed;
    top: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: #333;
    color: #fff;
    padding: 8px 20px;
    border-radius: 20px;
    font-size: 14px;
    opacity: 0;
    transition: opacity .3s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="container">
  <h1>时间戳转换工具</h1>
  <p class="subtitle">Unix 时间戳与日期时间互转 · 点击结果即可复制</p>

  <!-- 当前时间戳 -->
  <div class="card">
    <h2>当前时间</h2>
    <div class="now-display">
      <div class="now-item">
        <div class="label">当前时间戳（秒）</div>
        <div class="value" id="nowSec" onclick="copyText(this)">-</div>
      </div>
      <div class="now-item">
        <div class="label">当前时间戳（毫秒）</div>
        <div class="value" id="nowMs" onclick="copyText(this)">-</div>
      </div>
      <div class="now-item" style="flex-basis:100%">
        <div class="label">当前日期时间</div>
        <div class="value" id="nowDate" style="font-size:16px" onclick="copyText(this)">-</div>
      </div>
    </div>
  </div>

  <!-- 时间戳转日期 -->
  <div class="card">
    <h2>时间戳 → 日期时间</h2>
    <div class="row">
      <input type="text" id="tsInput" placeholder="输入时间戳，如 1759996800 或 1759996800000">
      <select id="tsUnit">
        <option value="auto">自动识别</option>
        <option value="s">秒</option>
        <option value="ms">毫秒</option>
      </select>
      <button onclick="tsToDate()">转换</button>
    </div>
    <div class="result" id="tsResult"></div>
    <p class="tip">支持 10 位（秒）或 13 位（毫秒）时间戳</p>
  </div>

  <!-- 日期转时间戳 -->
  <div class="card">
    <h2>日期时间 → 时间戳</h2>
    <div class="row">
      <input type="datetime-local" id="dateInput" step="1">
      <button onclick="dateToTs()">转换</button>
    </div>
    <div class="result" id="dateResult"></div>
    <p class="tip">按你电脑的本地时区（中国用户即北京时间 UTC+8）计算</p>
  </div>

  <footer>纯前端工具 · 所有计算在浏览器本地完成 · 数据不上传</footer>
</div>

<div class="toast" id="toast">已复制</div>

<script>
// ---------- 工具函数 ----------
function pad(n) { return n < 10 ? '0' + n : '' + n; }

function formatDate(d) {
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) +
    ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
}

function copyText(el) {
  const text = el.textContent.trim();
  if (!text || text === '-') return;
  navigator.clipboard.writeText(text).then(showToast).catch(() => {
    // 兼容旧浏览器
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast();
  });
}

function showToast() {
  const t = document.getElementById('toast');
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1200);
}

function addResultLine(container, label, value) {
  const line = document.createElement('div');
  line.className = 'result-line';
  const k = document.createElement('span');
  k.className = 'k';
  k.textContent = label;
  const v = document.createElement('span');
  v.className = 'v';
  v.textContent = value;
  v.title = '点击复制';
  v.onclick = () => copyText(v);
  line.appendChild(k);
  line.appendChild(v);
  container.appendChild(line);
}

// ---------- 当前时间实时刷新 ----------
function tick() {
  const now = Date.now();
  document.getElementById('nowMs').textContent = now;
  document.getElementById('nowSec').textContent = Math.floor(now / 1000);
  document.getElementById('nowDate').textContent = formatDate(new Date(now));
}
tick();
setInterval(tick, 1000);

// ---------- 时间戳转日期 ----------
function tsToDate() {
  const raw = document.getElementById('tsInput').value.trim();
  const unit = document.getElementById('tsUnit').value;
  const box = document.getElementById('tsResult');
  box.innerHTML = '';

  if (!/^-?\d+$/.test(raw)) {
    box.classList.add('show');
    addResultLine(box, '错误', '请输入纯数字时间戳');
    return;
  }

  let ts = Number(raw);
  if (unit === 's') ts = ts * 1000;
  else if (unit === 'auto' && raw.replace('-', '').length <= 11) ts = ts * 1000;
  // unit === 'ms' 或自动识别为毫秒时直接用

  const d = new Date(ts);
  if (isNaN(d.getTime())) {
    box.classList.add('show');
    addResultLine(box, '错误', '无效的时间戳');
    return;
  }

  box.classList.add('show');
  addResultLine(box, '本地时间（北京）', formatDate(d));
  addResultLine(box, 'UTC 时间', d.toISOString().replace('T', ' ').replace('Z', ' UTC'));
  addResultLine(box, 'ISO 8601', d.toISOString());
  addResultLine(box, '星期', '日一二三四五六'[d.getDay()] === undefined ? '' : '星期' + '日一二三四五六'[d.getDay()]);
  addResultLine(box, '秒级时间戳', Math.floor(d.getTime() / 1000));
  addResultLine(box, '毫秒级时间戳', d.getTime());
}

// ---------- 日期转时间戳 ----------
function dateToTs() {
  const raw = document.getElementById('dateInput').value;
  const box = document.getElementById('dateResult');
  box.innerHTML = '';

  if (!raw) {
    box.classList.add('show');
    addResultLine(box, '错误', '请先选择日期时间');
    return;
  }

  const d = new Date(raw);
  if (isNaN(d.getTime())) {
    box.classList.add('show');
    addResultLine(box, '错误', '无效的日期');
    return;
  }

  box.classList.add('show');
  addResultLine(box, '秒级时间戳', Math.floor(d.getTime() / 1000));
  addResultLine(box, '毫秒级时间戳', d.getTime());
  addResultLine(box, '对应时间', formatDate(d));
}

// 回车快捷转换
document.getElementById('tsInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') tsToDate();
});
</script>
</body>
</html>
